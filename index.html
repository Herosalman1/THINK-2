<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Link Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #fcd5de;
            font-family: "Quicksand", sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center;
        }

        #generator-ui { 
            background: #ffffff; padding: 40px 35px; border-radius: 24px; 
            width: 90%; max-width: 480px; box-shadow: 0 15px 35px rgba(239, 110, 126, 0.15); 
        }
        #generator-ui h2 { color: #ef6e7e; margin-bottom: 30px; font-weight: 700; font-size: 1.8rem; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a4a4a; font-size: 0.95rem; }
        .input-group input { 
            width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #fbd9de; 
            background: #fdf2f4; color: #111; font-size: 1rem; font-weight: 500; outline: none; 
        }
        .input-group input:focus { border-color: #ef6e7e; background: #fff; }
        
        #generateBtn { 
            width: 100%; background: #ef6e7e; border: none; padding: 16px; border-radius: 14px; 
            color: white; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 10px; margin-bottom: 15px; 
        }
        #generateBtn:hover { background-color: #df5869; }
        
        .result-box { 
            display: none; background: #fff0f3; padding: 20px; border-radius: 16px; 
            margin-top: 15px; border: 1.5px dashed #ffb3c6;
        }
        
        .action-btns-container { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn {
            background: #ef6e7e; color: white; border: none; padding: 12px; flex: 1;
            border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s;
        }
        .action-btn:hover { background-color: #df5869; }
    </style>
</head>
<body>

    <div id="generator-ui">
        <h2>Prank Link Generator</h2>
        
        <div class="input-group">
            <label>1ST MSG (Question) ✍️</label>
            <input type="text" id="qInput" value="हमेशा मेरे दोस्त बनकर रहोगे ना तुम ?" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>2ND MSG (Success) ✍️</label>
            <input type="text" id="sInput" value="करवा दिया ना OK !! 😂 😁 🤪" autocomplete="off">
        </div>
        
        <button id="generateBtn" onclick="generateLink()">✨ Generate Link</button>

        <div id="resultBox" class="result-box">
            <p style="font-weight: 700; color: #ef6e7e; text-align: center; font-size: 1.1rem; margin-bottom: 5px;">Link Generated! 🎉</p>
            <p id="generatedUrl" style="display: none;"></p>
            
            <div class="action-btns-container">
                <button class="action-btn" id="copyBtn" onclick="copyLink()">Copy Link 📋</button>
                <button class="action-btn" id="previewBtn" onclick="previewLink()">Click To Preview 🚀</button>
            </div>
        </div>
    </div>

    <script>
        function generateLink() {
            const q = document.getElementById('qInput').value.trim();
            const s = document.getElementById('sInput').value.trim();
            
            if(!q || !s) { alert("Please enter both messages!"); return; }

            const payload = { q: q, s: s };
            const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            const safeEncodedData = encodeURIComponent(base64Data);
            
            // Yahan par ab ye automatically 'prank.html' ka link banayega
            const currentPath = window.location.pathname;
            const newPath = currentPath.substring(0, currentPath.lastIndexOf('/')) + '/prank.html';
            const finalLink = window.location.origin + newPath + `?d=${safeEncodedData}`;
            
            document.getElementById('generatedUrl').innerText = finalLink;
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('copyBtn').innerText = "Copy Link 📋";
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✅ Copied!";
                setTimeout(() => { btn.innerText = "Copy Link 📋"; }, 2000);
            });
        }

        function previewLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            if(linkText) { window.open(linkText, '_blank'); }
        }
    </script>
</body>
</html>
